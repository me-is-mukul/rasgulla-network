{% extends "base.html" %}

{% block content %}
    <div class="form-container">
        <h2>Encrypt Text</h2>
        <form method="POST" action="{{ url_for('text.encrypt_text_route') }}">
            <div class="form-group">
                <label for="text">Text to Encrypt</label>
                <textarea id="text" name="text" rows="5" required></textarea>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Encrypt Text</button>
        </form>
        
        {% if encrypted_text %}
            <div class="result-container">
                <h3>Encrypted Text</h3>
                <textarea id="encrypted-text" rows="5" readonly>{{ encrypted_text }}</textarea>
                <div class="button-group">
                    <button id="copy-btn" class="btn btn-secondary">Copy to Clipboard</button>
                    <form method="POST" action="{{ url_for('text.download_encrypted_text') }}" style="display: inline;">
                        <input type="hidden" name="encrypted_text" value="{{ encrypted_text }}">
                        <button type="submit" class="btn btn-primary">Download Encrypted Text</button>
                    </form>
                </div>
            </div>
        {% endif %}
    </div>

    <script>
        document.getElementById('copy-btn').addEventListener('click', function() {
            const encryptedText = document.getElementById('encrypted-text');
            encryptedText.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        });
    </script>
{% endblock %}
