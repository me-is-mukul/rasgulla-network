{% extends "base.html" %}

{% block content %}
    <div class="form-container">
        <h2>Decrypt Uploaded File</h2>

        <form method="POST" enctype="multipart/form-data" action="{{ url_for('file.decrypt_uploaded_file') }}">
            
            <div class="form-group">
                <label for="file">Upload Encrypted File</label>
                <input type="file" id="file" name="file" required>
            </div>

            <div class="form-group">
                <label for="file_type">Select File Type</label>
                <select id="file_type" name="file_type" required>
                    <option value="binary">Encrypted File (AES Binary)</option>
                    <option value="txt">Encrypted Text File (TXT)</option>
                    <option value="png">Steganography Image (PNG/JPG)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary">Decrypt Uploaded File</button>
        </form>
    </div>
{% endblock %}
