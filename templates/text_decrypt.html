{% extends "base.html" %}

{% block content %}
    <div class="form-container">
        <h2>Decrypt Text</h2>
        <form method="POST" action="{{ url_for('text.decrypt_text_route') }}">
            <div class="form-group">
                <label for="encrypted_text">Encrypted Text</label>
                <textarea id="encrypted_text" name="encrypted_text" rows="5" required></textarea>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Decrypt Text</button>
        </form>
        
        {% if decrypted_text %}
            <div class="result-container">
                <h3>Decrypted Text</h3>
                <textarea id="decrypted-text" rows="5" readonly>{{ decrypted_text }}</textarea>
                <div class="button-group">
                    <button id="copy-btn" class="btn btn-secondary">Copy to Clipboard</button>
                    <form method="POST" action="{{ url_for('text.download_decrypted_text') }}" style="display: inline;">
                        <input type="hidden" name="decrypted_text" value="{{ decrypted_text }}">
                        <button type="submit" class="btn btn-primary">Download Decrypted Text</button>
                    </form>
                </div>
            </div>
        {% endif %}
    </div>

    <script>
        document.getElementById('copy-btn').addEventListener('click', function() {
            const decryptedText = document.getElementById('decrypted-text');
            decryptedText.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        });
    </script>
{% endblock %}
